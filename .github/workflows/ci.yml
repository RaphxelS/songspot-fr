name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

      # Note: the production build and tests run WITHOUT Spotify credentials.
      # The app automatically falls back to data/catalog.fr.json, so the CI
      # pipeline needs no secrets to pass.
